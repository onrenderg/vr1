<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Arcade Cockpit View - Driveable Car</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="script.js"></script>
</head>

<body>
    <a-scene>
        <!-- SKY -->
        <a-sky color="#5c94fc"></a-sky>

        <!-- STATIC ROAD BASE -->
        <a-plane position="0 0 -18" rotation="-90 0 0" width="6" height="40" color="#333333"></a-plane>
        <a-plane position="-2.9 0.01 -18" rotation="-90 0 0" width="0.1" height="40" color="#ffcc00"></a-plane>
        <a-plane position="2.9 0.01 -18" rotation="-90 0 0" width="0.1" height="40" color="#ffcc00"></a-plane>

        <!-- UNLIMITED TRACK ELEMENTS (Using shared global speed!) -->
        <!-- Center Lane Dashes -->
        <a-plane infinite-scroll="resetZ: 2; startZ: -38" position="0 0.02 -6" rotation="-90 0 0" width="0.2" height="3"
            color="#ffffff"></a-plane>
        <a-plane infinite-scroll="resetZ: 2; startZ: -38" position="0 0.02 -14" rotation="-90 0 0" width="0.2"
            height="3" color="#ffffff"></a-plane>
        <a-plane infinite-scroll="resetZ: 2; startZ: -38" position="0 0.02 -22" rotation="-90 0 0" width="0.2"
            height="3" color="#ffffff"></a-plane>
        <a-plane infinite-scroll="resetZ: 2; startZ: -38" position="0 0.02 -30" rotation="-90 0 0" width="0.2"
            height="3" color="#ffffff"></a-plane>
        <a-plane infinite-scroll="resetZ: 2; startZ: -38" position="0 0.02 -38" rotation="-90 0 0" width="0.2"
            height="3" color="#ffffff"></a-plane>

        <!-- Looping Roadside Trees -->
        <a-box infinite-scroll="resetZ: 2; startZ: -38" position="-4 1 -10" width="1" height="2" depth="1"
            color="#58a436"></a-box>
        <a-box infinite-scroll="resetZ: 2; startZ: -38" position="4 1 -24" width="1" height="2" depth="1"
            color="#58a436"></a-box>
        <a-box infinite-scroll="resetZ: 2; startZ: -38" position="-4 1 -38" width="1" height="2" depth="1"
            color="#58a436"></a-box>

        <!-- =================================================== -->
        <!-- PLAYER CAR RIG (Moves the entire car + camera!)     -->
        <!-- =================================================== -->
        <a-entity id="player-car" car-controls position="0 0 0">

            <!-- CAMERA (WASD disabled so you don't walk out of the car!) -->
            <a-entity position="0 1.2 0">
                <a-camera wasd-controls="enabled: false"></a-camera>
            </a-entity>

            <!-- CAR INTERIOR FRAME -->
            <a-box position="-0.75 1.3 -0.8" width="0.15" height="1.1" depth="0.2" color="#1a1a1a"
                rotation="0 0 -15"></a-box>
            <a-box position="0.75 1.3 -0.8" width="0.15" height="1.1" depth="0.2" color="#1a1a1a"
                rotation="0 0 15"></a-box>
            <a-box position="0 1.8 -0.8" width="1.65" height="0.15" depth="0.3" color="#1a1a1a"></a-box>
            <a-plane position="0 1.3 -0.85" width="1.35" height="0.9" color="#aaccff" opacity="0.15"
                transparent="true"></a-plane>

            <!-- DASHBOARD / MINI ARCADE RACING CONSOLE -->
            <a-box position="0 0.6 -0.8" width="1.6" height="0.5" depth="0.8" color="#2b2b2b"
                rotation="-15 0 0"></a-box>
            <a-box position="0 0.83 -0.7" width="0.7" height="0.05" depth="0.35" color="#e60012"
                rotation="-15 0 0"></a-box>

            <!-- 8-Bit Arcade Screen -->
            <a-plane position="0 0.95 -0.75" width="0.6" height="0.35" color="#00ffcc" rotation="-15 0 0"
                material="shader: flat;"></a-plane>
            <a-plane position="0 0.95 -0.01 -0.74" width="0.5" height="0.25" color="#000000" rotation="-15 0 0"
                material="shader: flat;"></a-plane>
            <a-box arcade-movement position="0 0.9 -0.73" width="0.08" height="0.08" depth="0.01" color="#ff0055"
                rotation="-15 0 0" material="shader: flat;"></a-box>

            <!-- Arcade Controls -->
            <a-cylinder position="-0.2 0.85 -0.6" radius="0.03" height="0.05" color="#ffff00"
                rotation="-15 0 0"></a-cylinder>
            <a-cylinder position="-0.1 0.85 -0.6" radius="0.03" height="0.05" color="#0088ff"
                rotation="-15 0 0"></a-cylinder>
            <a-box position="0.2 0.87 -0.6" width="0.04" height="0.1" depth="0.04" color="#ffffff"
                rotation="-30 0 0"></a-box>

        </a-entity>
    </a-scene>
</body>

</html>
