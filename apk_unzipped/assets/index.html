<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Arcade Cockpit</title>
    <meta name="description" content="Arcade Cockpit View - Driveable Car VR Game for Meta Horizon Store">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e74c3c">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-512.png">
    <link rel="stylesheet" href="style.css">

    <!-- LOCAL AFRAME LIBRARY -->
    <script src="aframe.min.js"></script>
    <script src="script.js"></script>
</head>

<body>
    <a-scene traffic-spawner webxr="requiredFeatures: hit-test, local-floor;">
        <!-- VR CONTROLLERS & RAYCASTERS -->
        <a-entity id="left-controller" oculus-touch-controls="hand: left" exit-modal-handler laser-controls="hand: left" raycaster="objects: .clickable; far: 5"></a-entity>
        <a-entity id="right-controller" oculus-touch-controls="hand: right" exit-modal-handler laser-controls="hand: right" raycaster="objects: .clickable; far: 5"></a-entity>

        <!-- SKY -->
        <a-sky color="#5c94fc"></a-sky>

        <!-- STATIC ROAD BASE (Doubled Width to 12) -->
        <a-plane position="0 0 -18" rotation="-90 0 0" width="12" height="40" color="#333333"></a-plane>
        <a-plane position="-5.9 0.01 -18" rotation="-90 0 0" width="0.1" height="40" color="#ffcc00"></a-plane>
        <a-plane position="5.9 0.01 -18" rotation="-90 0 0" width="0.1" height="40" color="#ffcc00"></a-plane>

        <!-- UNLIMITED TRACK ELEMENTS (4 Lanes with Dash Lines at X = -3, 0, 3) -->
        <!-- Lane Divider Left (X = -3) -->
        <a-plane infinite-scroll="resetZ: 2; startZ: -38" position="-3 0.02 -6" rotation="-90 0 0" width="0.2" height="3" color="#ffffff"></a-plane>
        <a-plane infinite-scroll="resetZ: 2; startZ: -38" position="-3 0.02 -14" rotation="-90 0 0" width="0.2" height="3" color="#ffffff"></a-plane>
        <a-plane infinite-scroll="resetZ: 2; startZ: -38" position="-3 0.02 -22" rotation="-90 0 0" width="0.2" height="3" color="#ffffff"></a-plane>
        <a-plane infinite-scroll="resetZ: 2; startZ: -38" position="-3 0.02 -30" rotation="-90 0 0" width="0.2" height="3" color="#ffffff"></a-plane>
        <a-plane infinite-scroll="resetZ: 2; startZ: -38" position="-3 0.02 -38" rotation="-90 0 0" width="0.2" height="3" color="#ffffff"></a-plane>

        <!-- Lane Divider Center (X = 0) -->
        <a-plane infinite-scroll="resetZ: 2; startZ: -38" position="0 0.02 -6" rotation="-90 0 0" width="0.2" height="3" color="#ffffff"></a-plane>
        <a-plane infinite-scroll="resetZ: 2; startZ: -38" position="0 0.02 -14" rotation="-90 0 0" width="0.2" height="3" color="#ffffff"></a-plane>
        <a-plane infinite-scroll="resetZ: 2; startZ: -38" position="0 0.02 -22" rotation="-90 0 0" width="0.2" height="3" color="#ffffff"></a-plane>
        <a-plane infinite-scroll="resetZ: 2; startZ: -38" position="0 0.02 -30" rotation="-90 0 0" width="0.2" height="3" color="#ffffff"></a-plane>
        <a-plane infinite-scroll="resetZ: 2; startZ: -38" position="0 0.02 -38" rotation="-90 0 0" width="0.2" height="3" color="#ffffff"></a-plane>

        <!-- Lane Divider Right (X = 3) -->
        <a-plane infinite-scroll="resetZ: 2; startZ: -38" position="3 0.02 -6" rotation="-90 0 0" width="0.2" height="3" color="#ffffff"></a-plane>
        <a-plane infinite-scroll="resetZ: 2; startZ: -38" position="3 0.02 -14" rotation="-90 0 0" width="0.2" height="3" color="#ffffff"></a-plane>
        <a-plane infinite-scroll="resetZ: 2; startZ: -38" position="3 0.02 -22" rotation="-90 0 0" width="0.2" height="3" color="#ffffff"></a-plane>
        <a-plane infinite-scroll="resetZ: 2; startZ: -38" position="3 0.02 -30" rotation="-90 0 0" width="0.2" height="3" color="#ffffff"></a-plane>
        <a-plane infinite-scroll="resetZ: 2; startZ: -38" position="3 0.02 -38" rotation="-90 0 0" width="0.2" height="3" color="#ffffff"></a-plane>

        <!-- Looping Roadside Trees -->
        <a-box infinite-scroll="resetZ: 2; startZ: -38" position="-7 1 -10" width="1" height="2" depth="1" color="#58a436"></a-box>
        <a-box infinite-scroll="resetZ: 2; startZ: -38" position="7 1 -24" width="1" height="2" depth="1" color="#58a436"></a-box>
        <a-box infinite-scroll="resetZ: 2; startZ: -38" position="-7 1 -38" width="1" height="2" depth="1" color="#58a436"></a-box>

        <!-- =================================================== -->
        <!-- PLAYER CAR RIG (Moves the entire car + camera!)     -->
        <!-- =================================================== -->
        <a-entity id="player-car" car-controls="roadLimitX: 5.2" position="0 0 0">

            <!-- CAMERA (Driver Eye View) -->
            <a-entity position="0 1.2 0">
                <a-camera wasd-controls="enabled: false">
                    <!-- CRASH RED FLASH OVERLAY -->
                    <a-plane id="crash-flash" position="0 0 -0.3" width="2" height="2" color="#ff0000" material="shader: flat; opacity: 0.55; transparent: true" visible="false"></a-plane>
                    
                    <!-- CRASH WARNING TEXT HUD -->
                    <a-text id="crash-warning-text" value="💥 CRASH PENALTY!" position="-0.7 0.35 -0.6" scale="0.45 0.45 0.45" color="#ff1111" visible="false"></a-text>

                    <!-- EXIT GAME DIALOG MODAL (Attached to camera view) -->
                    <a-entity id="exit-modal" position="0 0.05 -0.8" visible="false">
                        <a-plane position="0 0 0" width="0.9" height="0.5" color="#0f172a" material="shader: flat; opacity: 0.95; transparent: true"></a-plane>
                        <a-text value="EXIT GAME?" position="0 0.15 0.01" align="center" color="#ffffff" scale="0.45 0.45 0.45"></a-text>
                        <a-text value="Press X key / button to toggle" position="0 0.07 0.01" align="center" color="#94a3b8" scale="0.22 0.22 0.22"></a-text>
                        
                        <!-- EXIT BUTTON (Red) -->
                        <a-box id="btn-exit-game" class="clickable" position="-0.2 -0.08 0.02" width="0.32" height="0.14" depth="0.02" color="#ef4444">
                            <a-text value="EXIT" position="0 0 0.02" align="center" color="#ffffff" scale="0.35 0.35 0.35"></a-text>
                        </a-box>
                        
                        <!-- STAY BUTTON (Green) -->
                        <a-box id="btn-stay-game" class="clickable" position="0.2 -0.08 0.02" width="0.32" height="0.14" depth="0.02" color="#22c55e">
                            <a-text value="STAY" position="0 0 0.02" align="center" color="#ffffff" scale="0.35 0.35 0.35"></a-text>
                        </a-box>
                    </a-entity>

                    <!-- CURSOR FOR DESKTOP & VR SELECTION -->
                    <a-cursor id="mouse-cursor" raycaster="objects: .clickable" cursor="fuse: false" position="0 0 -0.5" geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.01" material="color: white; shader: flat"></a-cursor>
                </a-camera>
            </a-entity>

            <!-- =================================================== -->
            <!-- REAL SPORTS CAR EXTERIOR & INTERIOR BODY            -->
            <!-- =================================================== -->

            <!-- FRONT CAR HOOD / BONNET -->
            <a-box position="0 0.45 -1.6" width="1.6" height="0.35" depth="2.2" color="#e74c3c"></a-box>
            <!-- Hood Center Power Bulge -->
            <a-box position="0 0.63 -1.6" width="0.4" height="0.05" depth="2.1" color="#111111"></a-box>

            <!-- FRONT BUMPER & HEADLIGHTS -->
            <a-box position="0 0.35 -2.68" width="1.58" height="0.25" depth="0.1" color="#222222"></a-box>
            <a-box position="-0.55 0.5 -2.67" width="0.35" height="0.15" depth="0.05" color="#ffff99"></a-box>
            <a-box position="0.55 0.5 -2.67" width="0.35" height="0.15" depth="0.05" color="#ffff99"></a-box>

            <!-- SIDE BODY PANELS & DOORS -->
            <a-box position="-0.82 0.5 -0.4" width="0.15" height="0.6" depth="2.2" color="#c0392b"></a-box>
            <a-box position="0.82 0.5 -0.4" width="0.15" height="0.6" depth="2.2" color="#c0392b"></a-box>

            <!-- SIDE REARVIEW MIRRORS -->
            <a-box position="-0.92 1.05 -0.6" width="0.15" height="0.1" depth="0.2" color="#111111" rotation="0 -15 0"></a-box>
            <a-box position="0.92 1.05 -0.6" width="0.15" height="0.1" depth="0.2" color="#111111" rotation="0 15 0"></a-box>

            <!-- WHEELS (Front & Rear) -->
            <a-cylinder position="-0.85 0.25 -1.4" rotation="0 0 90" radius="0.28" height="0.18" color="#111111"></a-cylinder>
            <a-cylinder position="0.85 0.25 -1.4" rotation="0 0 90" radius="0.28" height="0.18" color="#111111"></a-cylinder>
            <a-cylinder position="-0.85 0.25 0.4" rotation="0 0 90" radius="0.28" height="0.18" color="#111111"></a-cylinder>
            <a-cylinder position="0.85 0.25 0.4" rotation="0 0 90" radius="0.28" height="0.18" color="#111111"></a-cylinder>

            <!-- WINDSHIELD FRAME & A-PILLARS -->
            <a-box position="-0.75 1.25 -0.6" width="0.1" height="0.9" depth="0.1" color="#1a1a1a" rotation="-20 0 -12"></a-box>
            <a-box position="0.75 1.25 -0.6" width="0.1" height="0.9" depth="0.1" color="#1a1a1a" rotation="-20 0 12"></a-box>
            <a-box position="0 1.62 -0.52" width="1.55" height="0.08" depth="0.1" color="#1a1a1a"></a-box>
            <a-plane position="0 1.2 -0.56" width="1.45" height="0.75" color="#aaccff" opacity="0.18" transparent="true" rotation="-20 0 0"></a-plane>

            <!-- COCKPIT DASHBOARD -->
            <a-box position="0 0.68 -0.65" width="1.5" height="0.3" depth="0.5" color="#2c3e50"></a-box>
            <a-box position="0 0.8 -0.5" width="1.48" height="0.06" depth="0.3" color="#111111"></a-box>

            <!-- REAL 3D STEERING WHEEL -->
            <a-entity position="-0.25 0.82 -0.45" rotation="-25 0 0">
                <!-- Steering Rim -->
                <a-torus radius="0.15" tube="0.02" color="#1a1a1a"></a-torus>
                <!-- Steering Center Hub -->
                <a-cylinder position="0 0 0" rotation="90 0 0" radius="0.04" height="0.03" color="#e74c3c"></a-cylinder>
                <!-- Spokes -->
                <a-box position="0 -0.06 0" width="0.02" height="0.12" depth="0.01" color="#444444"></a-box>
                <a-box position="-0.06 0 0" width="0.12" height="0.02" depth="0.01" color="#444444"></a-box>
                <a-box position="0.06 0 0" width="0.12" height="0.02" depth="0.01" color="#444444"></a-box>
            </a-entity>

            <!-- DIGITAL INSTRUMENT CLUSTER / SPEEDOMETER DISPLAY -->
            <a-plane position="-0.25 0.95 -0.58" width="0.3" height="0.15" color="#00ffff" material="shader: flat;" rotation="-15 0 0"></a-plane>
            <a-plane position="0.25 0.95 -0.58" width="0.35" height="0.18" color="#000000" material="shader: flat;" rotation="-15 0 0"></a-plane>

            <!-- Arcade Controls / Mini Console on Center Dash -->
            <a-box arcade-movement position="0.25 0.96 -0.57" width="0.08" height="0.08" depth="0.01" color="#ff0055" rotation="-15 0 0" material="shader: flat;"></a-box>
            <a-cylinder position="0.15 0.83 -0.48" radius="0.025" height="0.04" color="#ffff00"></a-cylinder>
            <a-cylinder position="0.35 0.83 -0.48" radius="0.025" height="0.04" color="#0088ff"></a-cylinder>

        </a-entity>
    </a-scene>
</body>

</html>
